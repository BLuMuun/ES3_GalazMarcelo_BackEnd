<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Despensa familiar</title>
    <style>
        body { max-width: 480px; margin: 10vh auto; padding: 0 18px; color: #20302d; background: #f3f6f4; font-family: Arial, sans-serif; }
        main { padding: 26px; border: 1px solid #d8e2dd; border-radius: 12px; background: #fff; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #aebdb5; border-radius: 6px; font: inherit; }
        .button { margin-top: 20px; border: 0; border-radius: 7px; padding: 10px 14px; color: #fff; background: #236b52; cursor: pointer; font: inherit; }
        .errorlist, .errornote { color: #a12828; }
    </style>
</head>
<body>
    <main>
        <h1>Despensa familiar</h1>
        <p>Inicia sesión para consultar el inventario y los retiros.</p>
        {% if form.errors %}<p class="errornote">Usuario o contraseña incorrectos.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            {% endfor %}
            <button class="button" type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
