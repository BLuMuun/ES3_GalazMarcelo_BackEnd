<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ accion }} | Despensa familiar</title>
    <style>
        body { max-width: 680px; margin: 40px auto; padding: 0 18px; color: #20302d; background: #f3f6f4; font-family: Arial, sans-serif; }
        main { padding: 24px; border: 1px solid #d8e2dd; border-radius: 12px; background: #fff; }
        label { display: block; margin: 18px 0 7px; font-weight: 700; }
        input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #aebdb5; border-radius: 6px; font: inherit; }
        .help, .muted { color: #5e6f69; font-size: .94rem; }
        .errorlist { color: #a12828; }
        .button { display: inline-block; border: 0; border-radius: 7px; padding: 10px 14px; color: #fff; background: #236b52; text-decoration: none; cursor: pointer; font: inherit; }
        .secondary { color: #20302d; background: #e8efeb; }
        .actions { display: flex; gap: 10px; margin-top: 22px; }
    </style>
</head>
<body>
    <main>
        <h1>{{ accion }}</h1>
        {% if registro %}<p class="muted">Resultado anterior: {{ registro.resultado }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
                {{ field.errors }}
            {% endfor %}
            <div class="actions">
                <button class="button" type="submit">Guardar</button>
                <a class="button secondary" href="{% url 'lista' %}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
